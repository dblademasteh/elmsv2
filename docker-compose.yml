services:
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: lms-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - lms-network

  api:
    build: .
    container_name: lms-api-dev
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lms_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-min-256-chars-long-key-xxxxxxxxxxxxxxxx
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - ./app:/app/app
      - ./scripts:/app/scripts
    working_dir: /app
    command: >
      sh -c "python scripts/init_db.py && 
            uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    restart: unless-stopped
    networks:
      - lms-network

volumes:
  postgres_dev_data:

networks:
  lms-network: