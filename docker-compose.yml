services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - lms-network

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lms_dev
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    working_dir: /app
    command: >
      sh -c "python scripts/init_db.py && 
            uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers"
    restart: unless-stopped
    networks:
      - lms-network

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:8080/api/v1
    depends_on:
      - api
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  postgres_dev_data:

networks:
  lms-network:
