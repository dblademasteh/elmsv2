services:
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: lms-redis-dev
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - lms-network

  api:
    build: .
    container_name: lms-api-dev
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lms_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-min-256-chars-long-key-xxxxxxxxxxxxxxxx
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    working_dir: /app
    command: >
      sh -c "python scripts/init_db.py && 
            uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --proxy-headers"
    restart: unless-stopped
    networks:
      - lms-network

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: lms-web-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  postgres_dev_data:

networks:
  lms-network:
